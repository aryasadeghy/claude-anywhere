name: Release

# Nothing is released from a laptop. A pull request merges, CI goes green on main,
# and this cuts the version, tags it, builds the three installers and publishes them
# — so what is on the Releases page is always what main is, built by GitHub.
#
# By hand: Actions → Release → Run workflow. A version there forces that number
# (that is how 1.0.0 happens); "dry run" prints what it would do and stops.
#
# Why `workflow_run` and not `push: main`: the release has to be the thing CI just
# passed, and a workflow cannot wait on another one any other way.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.5.0 (blank = decide from the changelog)'
        required: false
      dry_run:
        description: 'Only show what would happen'
        type: boolean
        default: false

permissions:
  contents: write

# Two merges close together must not race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: Version and tag
    # A red CI run is not a release.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the tags are how it knows what the last release was
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Is there a release in this?
        id: plan
        run: node scripts/next-version.mjs "${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        run: echo "::notice::No release — ${{ steps.plan.outputs.reason }}"

      - name: Set the version, move the changelog, tag it
        if: steps.plan.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- "${{ steps.plan.outputs.version }}"
          echo "--- what the release page will say ---"
          node scripts/release-notes.mjs "${{ steps.plan.outputs.version }}"

      - name: Push it
        if: steps.plan.outputs.release == 'true' && inputs.dry_run != true
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.plan.outputs.tag }}"
          echo "::notice::Pushed ${{ steps.plan.outputs.tag }} — building the installers"

      - name: Dry run
        if: steps.plan.outputs.release == 'true' && inputs.dry_run == true
        run: git --no-pager show --stat HEAD

  build:
    name: ${{ matrix.name }}
    needs: decide
    if: needs.decide.outputs.release == 'true' && inputs.dry_run != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
            args: ''
          # One Mac file for both chips. Building them separately needed an Intel
          # runner, and those sat queued for an hour at a time without ever starting;
          # a universal binary is larger but it is one download and one job.
          - os: macos-latest
            name: macOS (universal)
            args: '--target universal-apple-darwin'
          # .deb only for now: the AppImage bundler fails on the runner without
          # printing why, twice, after twenty-five minutes of compiling each time.
          - os: ubuntu-22.04
            name: Linux (deb)
            args: '--bundles deb'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # A universal binary is compiled once for each chip, so the Mac runner needs both.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri draws the window with the system webview; on Linux that is WebKitGTK.
      # linuxdeploy, which builds the AppImage, is itself an AppImage, and running one
      # needs FUSE 2 — which Ubuntu 22.04 and later do not ship. Without it the build
      # compiles for forty minutes and then says only "failed to run linuxdeploy".
      - name: System webview and its build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 fuse

      # The installer carries the server and its dependencies (bundle.resources),
      # so a production install must be present before the bundler runs.
      - run: npm ci --omit=dev

      # The terminal's native half comes as one package per chip, and npm installs only the
      # runner's (arm64). The universal app runs on Intel Macs too, so the x64 one goes in beside
      # it; without it an Intel Mac falls back to a plain pipe with no colours or resize.
      - name: The terminal for both Mac chips
        if: startsWith(matrix.os, 'macos')
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@lydell/node-pty'].version")
          npm pack "@lydell/node-pty-darwin-x64@$v" --silent
          mkdir -p node_modules/@lydell/node-pty-darwin-x64
          tar -xzf lydell-node-pty-darwin-x64-*.tgz -C node_modules/@lydell/node-pty-darwin-x64 --strip-components=1
          rm lydell-node-pty-darwin-x64-*.tgz

      # And its own Node (runtime/), so nobody has to install one before the app starts.
      # On the Mac that is both chips in one binary, like the app itself.
      - name: Node for the installer
        run: node scripts/fetch-node.mjs ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }}

      # github.sha is the commit CI ran on, which is one older than the release
      # commit this checks out — the built app must name the one it was built from.
      - name: Which commit this is
        id: built
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the version in the app
        shell: bash
        run: |
          tag="${{ needs.decide.outputs.tag }}"
          tag="${tag#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "tag $tag, tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate - they must agree"; exit 1
          fi
          echo "version $tag"

      # What people read on the release page should be what changed, not a link to it.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "${{ needs.decide.outputs.tag }}" > RELEASE_NOTES.md
          echo "--- notes ---"; cat RELEASE_NOTES.md
          {
            echo "body<<CHANGELOG_SECTION"
            cat RELEASE_NOTES.md
            echo "CHANGELOG_SECTION"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The window's About line says which commit it was built from, and only the
          # build knows that: the installed app has no repository to ask.
          CLAUDE_ANYWHERE_COMMIT: ${{ steps.built.outputs.sha }}
          # And if FUSE is still not usable, unpack the tool instead of mounting it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          args: ${{ matrix.args }}
          tagName: ${{ needs.decide.outputs.tag }}
          releaseName: Claude Anywhere ${{ needs.decide.outputs.tag }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            **Install:** Windows `.exe`, macOS `.dmg` (one file, both chips), Linux
            `.deb`. Node.js and Claude Code are both included; nothing else to install.

            The macOS build is not signed, so the first launch needs right-click → Open.

            **First run:** the app asks which Claude account to use — this computer's `claude login`,
            or a token from `claude setup-token`.
          # Draft while three runners are still attaching files to it: a half-filled
          # release is what the app would offer people to download.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

  publish:
    name: Publish
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All three installers are attached by now, so the release stops being a draft
      # in one move. This is also the moment the running apps start offering it.
      - name: Make it downloadable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.decide.outputs.tag }}"
          gh release edit "$tag" --draft=false --latest
          echo "::notice::$tag is out: $(gh release view "$tag" --json url -q .url)"
          gh release view "$tag" --json assets -q '.assets[].name'
